[project]
name = "ccnlthd"
version = "0.1.0"
description = "CV matching with LangGraph, Google Gemini, Chroma and human review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.1.1",
    "fastapi>=0.143.0",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.2,<5",
    "google-genai>=2.20.0,<3",
    "httpx[socks]>=0.28",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "pypdf>=6.20.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
research = ["pyarrow>=26.0.0"]

[dependency-groups]
dev = ["pytest>=8.4", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
