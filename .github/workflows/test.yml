name: test

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Backend tests
        run: uv run pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Frontend tests
        run: node --test tests/frontend.test.cjs
